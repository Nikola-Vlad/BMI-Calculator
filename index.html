<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>BMI Calculator project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <h1>BMI Calculator</h1>
        <p>BMI (Body Mass Index) is a simple measurement that uses your height and weight to estimate whether your
            weight falls within a healthy range.</p>

        <div class="calculator">
            <h2>Calculate Your BMI</h2>

            <div class="flex-units">
                <label class="us-units-btn">US Units</label>
                <label class="metric-units-btn">Metric Units</label>
            </div>

            <div class="flex-metrics">
                <div class="height-wrapper">
                    <label class="height">Height</label>

                    <div class="metric-height">
                        <input id="height-input-field" type="number">
                        <span>cm</span>
                    </div>

                    <div class="us-height">
                        <div class="height-field">
                            <input id="feet-input-field" type="number">
                            <span>ft</span>
                        </div>

                        <div class="height-field">
                            <input id="inches-input-field" type="number">
                            <span>in</span>
                        </div>
                    </div>
                </div>

                <div class="weight-wrapper">
                    <label class="weight">Weight</label>

                    <div class="metric-weight">
                        <input id="weight-input-field" type="number">
                        <span>kg</span>
                    </div>

                    <div class="us-weight">
                        <input id="lbs-input-field" type="number">
                        <span>lbs</span>
                    </div>
                </div>
            </div>

            <div class="flex-buttons">
                <button id="calculateBtn">Calculate BMI</button>
                <button id="resetBtn">Reset</button>
            </div>

            <div class="bmi-result">
                <h3>33.4</h3>
                <span>OBESE</span>
            </div>
        </div>

    </main>

</body>

</html>
