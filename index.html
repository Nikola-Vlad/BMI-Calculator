<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>BMI Calculator project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <h1>BMI Calculator</h1>
        <p>BMI (Body Mass Index) is a simple measurement that uses your height and weight to estimate whether your
            weight falls within a healthy range.</p>

        <div class="calculator">
            <h2>Calculate Your BMI</h2>

            <div class="flex-units">
                <label class="us-units-btn">US Units</label>
                <label class="metric-units-btn">Metric Units</label>
            </div>

            <div class="flex-metrics">
                <div class="height-wrapper">
                    <label class="height" for="height-input-field">Height</label>
                    <input id="height-input-field" type="number">
                    <span>cm</span>
                </div>

                <div class="weight-wrapper">
                    <label class="weight" for="weight-input-field">Weight</label>
                    <input id="weight-input-field" type="number">
                    <span>kg</span>
                </div>
            </div>

        </div>
        <div class="flex-buttons">
            <button id="calculateBtn">Calculate BMI</button>
            <button id="resetBtn">Reset</button>
        </div>

    </main>

</body>

</html>
