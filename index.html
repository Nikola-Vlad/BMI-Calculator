<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>BMI Calculator project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <script src="script.js" defer></script>
</head>

<body>
    <main class="bmi-calculator">
        <h1>BMI Calculator</h1>
        <p>BMI (Body Mass Index) is a simple measurement that uses your height and weight to estimate whether your
            weight falls within a healthy range.</p>

        <div class="calculator">
            <h2>Calculate Your BMI</h2>

            <div class="unit-preferences">
                <button class="imperial-units-btn active">Imperial</button>
                <button class="metric-units-btn">Metric</button>
            </div>

            <div class="input-group">
                <label class="height-label">Height</label>

                <div class="imperial-height-flex-container">
                    <div class="imperial-height-field">
                        <input class="feet-input-bar" type="number">
                        <span>ft</span>
                    </div>

                    <div class="imperial-height-field">
                        <input class="inches-input-bar" type="number">
                        <span>in</span>
                    </div>
                </div>

                <div class="metric-height-field hidden">
                    <input class="cm-input-bar" type="number">
                    <span>cm</span>
                </div>
            </div>

            <div class="input-group">
                <label class="weight-label">Weight</label>

                <div class="imperial-weight-field">
                    <input class="lbs-input-bar" type="number">
                    <span>lbs</span>
                </div>

                <div class="metric-weight-field hidden">
                    <input class="kg-input-bar" type="number">
                    <span>kg</span>
                </div>
            </div>

            <div class="action-buttons-row">
                <button class="calculateBtn">Calculate BMI</button>
                <button class="resetBtn">Reset</button>
            </div>

            <div class="bmi-result">
                <label class="bmi-label">Your BMI:</label>
                <h3 class="bmi-value"></h3>
                <div class="bmi-category">TEST</div>
            </div>
        </div>

    </main>

</body>

</html>
